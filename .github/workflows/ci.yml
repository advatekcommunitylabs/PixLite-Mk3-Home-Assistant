name: Integration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install aiohttp==3.14.5 pytest==9.1.1 pytest-asyncio==1.4.0 voluptuous==0.16.0
      - run: python -m pytest tests/test_api.py tests/test_controls.py -q

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install homeassistant==2026.10.2 pytest-homeassistant-custom-component==0.13.373
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/components/advatek_pixlite -q
      - run: python script/test_core_candidate.py

  source-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.2 build
      - run: ruff check custom_components core script tests/components
      - run: ruff format --check custom_components core script tests/components
      - run: python -m build
