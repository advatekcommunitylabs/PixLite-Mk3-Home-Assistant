name: Integration tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test-ha.txt
      - run: python -m pip install -r requirements-test-ha.txt
      - name: Real Home Assistant interfaces
        run: python -m pytest tests/ha -q --asyncio-mode=auto --cov=custom_components.advatek_pixlite --cov-branch --cov-report=term-missing --cov-report=xml:coverage-ha.xml --junitxml=results-ha.xml
      - name: Protocol and focused regression tests
        run: python -m pytest tests/test_api.py tests/test_controls.py docs/reviews/reproduce_2026_10_22.py -q --asyncio-mode=auto --junitxml=results-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            results-*.xml
            coverage-ha.xml
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
